name: Setup Rust
description: Install system deps, update Rust toolchain, and cache Cargo.

inputs:
  target:
    description: Optional Rust cross-compilation target to add.
    default: ''
  extra-packages:
    description: Extra apt packages to install alongside just.
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        packages="just"
        if [ -n "${{ inputs.extra-packages }}" ]; then
          packages="$packages ${{ inputs.extra-packages }}"
        fi
        sudo apt-get update && sudo apt-get install -y $packages

    - name: Update rust
      shell: bash
      run: rustup update

    - name: Add Rust target
      if: inputs.target != ''
      shell: bash
      run: rustup target add ${{ inputs.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.target }}
