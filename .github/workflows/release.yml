name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: lidi-send,lidi-send-oneshot,lidi-receive,lidi-receive-oneshot,lidi-dir-send,lidi-file-send,lidi-file-receive,lidi-flood-send,lidi-flood-receive,lidi-udp-send,lidi-udp-receive,lidi-network-simulator
          archive: lidi-$tag
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-docker-image:
    name: Builds and pushes a tagged docker image
    needs: create-release
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        lidi_target:
          - send
          - receive
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: docker_meta
        with:
          images: docker.io/anssi/lidi-${{ matrix.lidi_target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: ${{ matrix.lidi_target }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  update-release-notes:
    name: Add Docker images to release notes
    runs-on: ubuntu-26.04
    needs: [upload, build-and-push-docker-image]
    steps:
      - uses: actions/checkout@v6

      - name: Append Docker image info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          existing_body=$(gh release view "$tag" --json body --jq '.body')
          docker_section=$(cat <<EOF

          ---

          ## Docker images

          - \`docker.io/anssi/lidi-send:${tag#v}\`
          - \`docker.io/anssi/lidi-receive:${tag#v}\`
          EOF
          )
          gh release edit "$tag" --notes "$existing_body$docker_section"
