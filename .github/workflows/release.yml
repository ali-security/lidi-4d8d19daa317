name: Release

on:
  push:
    tags: [ v* ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release from
        required: true
        default: v2.1.1

env:
  CARGO_TERM_COLOR: always

# The fork's default_workflow_permissions is read, so GITHUB_TOKEN cannot
# create a release without asking for contents: write explicitly.
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
  upload:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: diode-send,diode-receive,diode-send-file,diode-receive-file,diode-send-udp,diode-receive-udp
          archive: lidi-$tag
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
  build-and-push-docker-image:
    name: Builds and pushes a tagged docker image
    # Pushes to docker.io/anssi/*, and the fork has no Docker Hub secrets.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lidi_service:
          - send
          - receive
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: docker_meta
        with:
          images: docker.io/anssi/lidi-${{ matrix.lidi_service }}
          tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: ${{ matrix.lidi_service }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
      

